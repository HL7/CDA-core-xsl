<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDA Viewer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; color: #333; line-height: 1.5; }
        .header-area { max-width: 900px; margin: 0 auto; }
        h1 { border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; color: #888; margin: 20px 0; transition: all 0.2s; }
        .drop-zone.active { border-color: #0366d6; background: #f0f7ff; color: #0366d6; }
        .drop-zone input { display: none; }
        .drop-zone label { cursor: pointer; text-decoration: underline; color: #0366d6; }
        .actions { margin: 15px 0; }
        .actions a { display: inline-block; padding: 6px 14px; margin-right: 8px; border-radius: 4px; text-decoration: none; font-size: 13px; cursor: pointer; }
        .btn-secondary { background: white; color: #0366d6; border: 1px solid #0366d6; }
        .error { color: #d32f2f; background: #ffeef0; padding: 12px; border-radius: 4px; margin: 10px 0; }
        #preview { border: 1px solid #ddd; border-radius: 4px; margin-top: 10px; background: white; }
        #preview iframe { width: 100%; min-height: 700px; border: none; display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header-area">
    <h1>CDA Viewer</h1>
    <p>Drop or select a CDA XML file to render it. This adds a reference to the
       CDA R2 Stylesheet and lets your browser transform the XML to HTML natively.
       No data is uploaded — everything runs locally in your browser.</p>

    <div class="drop-zone" id="dropZone">
        <p>Drag and drop a CDA XML file here</p>
        <p>or <label for="fileInput">choose a file</label></p>
        <input type="file" id="fileInput" accept=".xml,.cda">
    </div>

    <div id="error" class="error hidden"></div>

    <div id="actions" class="actions hidden">
        <a id="newTabLink" class="btn-secondary" target="_blank">Open in new tab</a>
    </div>
    </div>

    <div id="preview" class="hidden">
        <iframe id="previewFrame"></iframe>
    </div>

    <script>
        const xslUrl = new URL('CDA.xsl', window.location.href).href;
        let currentBlobUrl = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
        dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('active'); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

        function handleFile(file) {
            if (!file) return;
            clearAll();
            const reader = new FileReader();
            reader.onload = () => processXml(reader.result);
            reader.readAsText(file);
        }

        function processXml(xmlText) {
            // Validate XML
            const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
            if (doc.querySelector('parsererror')) {
                showError('Invalid XML: ' + doc.querySelector('parsererror').textContent);
                return;
            }

            // Strip existing xml-stylesheet PIs and inject ours
            let cleaned = xmlText.replace(/<\?xml-stylesheet[^?]*\?>\s*/g, '');
            const pi = '<?xml-stylesheet type="text/xsl" href="' + xslUrl + '"?>\n';
            cleaned = cleaned.replace(/(^<\?xml[^?]*\?>\s*)/, '$1' + pi);
            if (!cleaned.startsWith('<?xml')) {
                cleaned = '<?xml version="1.0" encoding="UTF-8"?>\n' + pi + cleaned;
            }

            // Create blob URL
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            const blob = new Blob([cleaned], { type: 'application/xml' });
            currentBlobUrl = URL.createObjectURL(blob);

            // Render in iframe and set up new-tab link
            document.getElementById('previewFrame').src = currentBlobUrl;
            document.getElementById('newTabLink').href = currentBlobUrl;
            document.getElementById('preview').classList.remove('hidden');
            document.getElementById('actions').classList.remove('hidden');
        }

        function showError(msg) { const el = document.getElementById('error'); el.textContent = msg; el.classList.remove('hidden'); }
        function clearAll() {
            document.getElementById('error').classList.add('hidden');
            document.getElementById('actions').classList.add('hidden');
            document.getElementById('preview').classList.add('hidden');
        }
    </script>
</body>
</html>
