name: Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  validate:
    name: Validation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Run validation checks
        run: ./run-tests.sh --validate

  xspec:
    name: XSpec unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Run XSpec tests
        run: ./run-tests.sh --xspec

  examples:
    name: Example regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Run example regression tests
        run: ./run-tests.sh --examples

  doc-reminder:
    name: Documentation reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if CDA.xsl changed without documentation update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^CDA\.xsl$'; then
            if ! echo "$changed" | grep -q '^documentation/'; then
              BODY="<!-- doc-reminder-comment -->
              ⚠️ **Documentation reminder**: \`CDA.xsl\` was modified but \`documentation/CDA.html\` was not updated. Please regenerate it from Oxygen XML Editor before merging."
              COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                --jq '.[] | select(.body | contains("<!-- doc-reminder-comment -->")) | .id' | head -1)
              if [ -n "$COMMENT_ID" ]; then
                gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
                  -X PATCH -f body="$BODY"
              else
                gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"
              fi
            fi
          fi
