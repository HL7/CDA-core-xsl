name: Deploy Pages

on:
  push:
    branches: ['**']
  delete:
    branches: ['**']
  pull_request:
    types: [opened]

# Allow only one concurrent deployment per ref
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build site
        run: |
          cp -r documentation _site
          cp -r examples _site/examples
          cp CDA.xsl cda_* _site/examples/

          # Build release preview zip
          # Update this list when adding files to the release package
          RELEASE_FILES="
            CDA.xsl
            cda_l10n.xml
            cda_narrativeblock.xml
            documentation/CDA.html
            documentation/docHtml.css
            documentation/cda_l10n.html
            documentation/img/*
          "
          mkdir -p _site/release
          BRANCH_NAME="${GITHUB_REF##refs/heads/}"
          ZIP_NAME="Sample_CDA_Style_Sheet-review-${BRANCH_NAME}.zip"
          zip -q "_site/release/${ZIP_NAME}" $RELEASE_FILES

      - name: Set up Java
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Generate render diffs
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          ./run-tests.sh --validate 2>/dev/null || true
          pip install --quiet lxml
          python3 scripts/render-diff.py --base origin/master

      - name: Deploy main site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true

      - name: Deploy branch preview and render diffs
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          mkdir -p _deploy/branches/${{ github.ref_name }}
          cp -r _site/* _deploy/branches/${{ github.ref_name }}/
          if [ -d scripts/diffResults ]; then
            mkdir -p _deploy/diffs/${{ github.ref_name }}
            cp -r scripts/diffResults/* _deploy/diffs/${{ github.ref_name }}/
          fi

      - name: Push to gh-pages (branch)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          keep_files: true

      - name: Create deployment status
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const previewUrl = `https://hl7.github.io/CDA-core-xsl/branches/${branch}/`;

            // Check if an active deployment already exists for this branch
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'preview',
              per_page: 100
            });
            const existing = deployments.data.find(d => d.description === `Preview for ${branch}`);
            if (existing) {
              // Update the existing deployment's status with the new SHA
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: existing.id,
                state: 'success',
                environment_url: previewUrl,
                log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                description: 'Preview deployed'
              });
              return;
            }

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              description: `Preview for ${branch}`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: previewUrl,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Preview deployed'
            });

  cleanup:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Remove branch preview
        run: |
          BRANCH_NAME="${{ github.event.ref }}"
          if [ -d "branches/${BRANCH_NAME}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "branches/${BRANCH_NAME}"
            git commit -m "Clean up preview for deleted branch ${BRANCH_NAME}"
            git push
          fi

  update-index:
    needs: [deploy, cleanup]
    if: |
      always()
      && (needs.deploy.result == 'success' || needs.cleanup.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Generate branch directory listing
        uses: gacts/directory-listing@v1
        with:
          target: branches
          overwrite: true

      - name: Generate diffs directory listing
        uses: gacts/directory-listing@v1
        with:
          target: diffs
          overwrite: true

      - name: Commit directory indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add branches/index.html diffs/index.html 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update directory indexes" && git push)

  comment-on-pr:
    needs: [deploy]
    if: |
      always()
      && (github.event_name == 'pull_request' || (github.event_name == 'push' && needs.deploy.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview link on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve branch name from either event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            BRANCH="${{ github.ref_name }}"
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json number --jq '.[0].number')
          fi

          # Skip if no PR or if this is main/master
          if [ -z "$PR_NUMBER" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "No PR found for ${BRANCH}, skipping"
            exit 0
          fi

          PREVIEW_URL="https://hl7.github.io/CDA-core-xsl/branches/${BRANCH}/"
          DIFF_URL="https://hl7.github.io/CDA-core-xsl/diffs/${BRANCH}/"
          ZIP_URL="https://hl7.github.io/CDA-core-xsl/branches/${BRANCH}/release/Sample_CDA_Style_Sheet-review-${BRANCH}.zip"

          # Wait for Pages deployment to be live (up to 2 minutes)
          wait_for_url() {
            local url="$1"
            local timeout=120
            local interval=10
            local elapsed=0
            echo "Waiting for $url ..."
            while [ $elapsed -lt $timeout ]; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if [ "$status" = "200" ]; then
                echo "  Live after ${elapsed}s"
                return 0
              fi
              sleep $interval
              elapsed=$((elapsed + interval))
            done
            echo "  Timed out after ${timeout}s (last status: $status)"
            return 1
          }

          wait_for_url "$PREVIEW_URL"
          wait_for_url "$DIFF_URL"
          wait_for_url "$ZIP_URL"

          BODY="<!-- render-diffs-comment -->
          📄 **Preview deployed:** [${PREVIEW_URL}](${PREVIEW_URL})
          🔀 **Render diffs:** [${DIFF_URL}](${DIFF_URL})
          📦 **Release preview:** [Sample_CDA_Style_Sheet-review-${BRANCH}.zip](${ZIP_URL})"

          # Find existing comment with our marker, update or create
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- render-diffs-comment -->")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
          fi
